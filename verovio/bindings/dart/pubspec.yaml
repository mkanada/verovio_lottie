name: verovio
description: >
  Dart FFI bindings for the Verovio Toolkit (this fork adds a native
  dotLottie exporter). Loads libverovio built with -DBUILD_AS_LIBRARY=ON;
  see README.md for how to build it and for platform coverage.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  ffi: ^2.1.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
